<text x="64" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Keep the buying decision, final agreement, estimate basis, and delivery plan connected.</text>
