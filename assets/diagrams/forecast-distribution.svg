<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">A forecast is a distribution, conditional on assumptions</title><desc id="desc">Illustrative completion distribution: median 5 weeks, 85th percentile 6 weeks. This is a model, not a commitment.</desc>
