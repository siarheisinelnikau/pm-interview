<polyline points="120,183 120,413 1090,413" fill="none" stroke="#526579" stroke-width="2"/>
<text x="122" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Share of simulated completions (%)</text>
