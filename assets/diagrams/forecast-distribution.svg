<rect x="64" y="476" width="1072" height="98" rx="10" fill="#eef4f8"/>
<text x="84" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Model result: P50 = 5 weeks; P85 = 6 weeks. More trials cannot repair biased history or hidden</text>
