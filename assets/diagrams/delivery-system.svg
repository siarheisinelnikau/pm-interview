<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Project delivery connects decisions to outcomes</title><desc id="desc">Project delivery connects decisions to outcomes. Healthcare, Fintech, and Cybersecurity change the evidence and consequences at every step. Product, Delivery, and Presales contribute at their boundaries.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<rect x="32" y="24" width="1136" height="612" rx="18" fill="#ffffff" stroke="#dce5ee"/>
<text x="64" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Project delivery connects decisions to outcomes</text>
<text x="64" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">A PM coordinates the whole chain; each decision still needs an accountable owner.</text>
