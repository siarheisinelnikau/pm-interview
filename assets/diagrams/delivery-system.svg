<text x="82.0" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Outcome</text>
<text x="82.0" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">User need, benefit,</text>
<text x="82.0" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">constraints, and</text>
<text x="82.0" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">ownership</text>
<polyline points="316.5,300 334.5,300" fill="none" stroke="#526579" stroke-width="3"/>
<polygon points="334.5,300 323.6946347717679,305.21958640933474 323.6946347717679,294.78041359066526" fill="#526579"/>
<rect x="338.5" y="175" width="248.5" height="255" rx="12" fill="#e5f5f1"/>
<text x="356.5" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Plan and flow</text>
<text x="356.5" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Scope, capacity,</text>
<text x="356.5" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">dependencies, cost,</text>
<text x="356.5" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">and uncertainty</text>
<polyline points="591.0,300 609.0,300" fill="none" stroke="#526579" stroke-width="3"/>
<polygon points="609.0,300 598.1946347717678,305.21958640933474 598.1946347717678,294.78041359066526" fill="#526579"/>
