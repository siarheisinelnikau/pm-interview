<text x="631.0" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">recovery</text>
<polyline points="865.5,300 883.5,300" fill="none" stroke="#526579" stroke-width="3"/>
<polygon points="883.5,300 872.6946347717678,305.21958640933474 872.6946347717678,294.78041359066526" fill="#526579"/>
