<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Capacity: nominal availability is only the starting point</title><desc id="desc">Forty person-days minus four leave, six support and four coordination leaves twenty-six planned person-days, subject to skills and dependencies.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<rect x="32" y="24" width="1136" height="612" rx="18" fill="#ffffff" stroke="#dce5ee"/>
<text x="64" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Capacity: nominal availability is only the starting point</text>
<text x="64" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Illustrative two-week allowance for four people: 40 nominal person-days.</text>
<rect x="88" y="224" width="100" height="82" rx="0" fill="#94a3b8"/>
<text x="138.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="text-before-edge">4</text>
<rect x="188" y="224" width="150" height="82" rx="0" fill="#a65b00"/>
<text x="263.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="text-before-edge">6</text>
<rect x="338" y="224" width="100" height="82" rx="0" fill="#7c3aed"/>
<text x="388.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="text-before-edge">4</text>
<rect x="438" y="224" width="650" height="82" rx="0" fill="#0f766e"/>
<text x="763.0" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="text-before-edge">26</text>
<rect x="88" y="349" width="18" height="18" rx="0" fill="#94a3b8"/>
<text x="119" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Leave: 4 person-days</text>
<rect x="618" y="349" width="18" height="18" rx="0" fill="#a65b00"/>
<text x="649" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Support: 6 person-days</text>
<rect x="88" y="398" width="18" height="18" rx="0" fill="#7c3aed"/>
<text x="119" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Coordination: 4 person-days</text>
<rect x="618" y="398" width="18" height="18" rx="0" fill="#0f766e"/>
<text x="649" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Planned work: 26 person-days</text>
<rect x="64" y="476" width="1072" height="98" rx="10" fill="#eef4f8"/>
<text x="84" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">26 person-days is not interchangeable specialist capacity. Avoid double-counting allowances already</text>
<text x="84" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">reflected in historical throughput.</text>
<text x="64" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Original teaching figure. Scenarios and numbers are illustrative.</text>
</svg>
