<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">RICE makes prioritization assumptions visible</title><desc id="desc">RICE makes prioritization assumptions visible. A tied score does not make the options equivalent. Essential controls and applicable obligations require explicit treatment.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<rect x="32" y="24" width="1136" height="612" rx="18" fill="#ffffff" stroke="#dce5ee"/>
<text x="64" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">RICE makes prioritization assumptions visible</text>
<text x="64" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Illustrative quarterly reach and person-month effort; not a universal ranking.</text>
<rect x="64" y="160" width="524" height="144" rx="12" fill="#eaf1ff"/>
<text x="82" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Option A</text>
<text x="82" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">1,000 reach x 1 impact x 0.8 confidence / 2 effort =</text>
<text x="82" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">400</text>
<rect x="612" y="160" width="524" height="144" rx="12" fill="#e5f5f1"/>
<text x="630" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Option B</text>
<text x="630" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">400 reach x 2 impact x 0.5 confidence / 1 effort =</text>
<text x="630" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">400</text>
<rect x="64" y="318" width="524" height="144" rx="12" fill="#fff2dc"/>
<text x="82" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Investigate</text>
<text x="82" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Validate low-confidence assumptions and</text>
<text x="82" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">dependencies</text>
<rect x="612" y="318" width="524" height="144" rx="12" fill="#f1edff"/>
<text x="630" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Decide</text>
<text x="630" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Use product authority, strategy, and required</text>
<text x="630" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">constraints</text>
<rect x="64" y="476" width="1072" height="98" rx="10" fill="#eef4f8"/>
<text x="84" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">A tied score does not make the options equivalent. Essential controls and applicable obligations require</text>
<text x="84" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">explicit treatment.</text>
<text x="64" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Original teaching figure. Scenarios and numbers are illustrative.</text>
</svg>
