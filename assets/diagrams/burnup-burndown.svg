<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">A burnup separates scope arrival from completed work</title><desc id="desc">Two charts show remaining work versus scope and completion. At day four remaining work rises because scope increases, despite continued completion.</desc>
<rect width="1200" height="660" fill="#f8fafc"/>
<rect x="32" y="24" width="1136" height="612" rx="18" fill="#ffffff" stroke="#dce5ee"/>
<text x="64" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">A burnup separates scope arrival from completed work</text>
<text x="64" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Illustrative item counts: eight items are added at day 4.</text>
<text x="112" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Burndown: remaining</text>
<polyline points="112,410.0 522,410.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="98" y="399.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">0</text>
<polyline points="112,340.0 522,340.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="98" y="329.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">10</text>
<polyline points="112,270.0 522,270.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="98" y="259.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">20</text>
<polyline points="112,200.0 522,200.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="98" y="189.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">30</text>
<polyline points="112,200 112,410 522,410" fill="none" stroke="#526579" stroke-width="2"/>
<polyline points="112.0,270.0 163.25,284.0 214.5,298.0 265.75,312.0 317.0,270.0 368.25,291.0 419.5,312.0 470.75,333.0 522.0,354.0" fill="none" stroke="#2563eb" stroke-width="4"/>
<text x="112.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 0</text>
<text x="317.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 4</text>
<text x="522.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 8</text>
<text x="680" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Burnup: scope and done</text>
<polyline points="680,410.0 1090,410.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="666" y="399.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">0</text>
<polyline points="680,340.0 1090,340.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="666" y="329.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">10</text>
<polyline points="680,270.0 1090,270.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="666" y="259.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">20</text>
<polyline points="680,200.0 1090,200.0" fill="none" stroke="#dce5ee" stroke-width="1"/>
<text x="666" y="189.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="end" dominant-baseline="text-before-edge">30</text>
<polyline points="680,200 680,410 1090,410" fill="none" stroke="#526579" stroke-width="2"/>
<polyline points="680.0,270.0 731.25,270.0 782.5,270.0 833.75,270.0 885.0,214.0 936.25,214.0 987.5,214.0 1038.75,214.0 1090.0,214.0" fill="none" stroke="#a65b00" stroke-width="4"/>
<polyline points="680.0,410.0 731.25,396.0 782.5,382.0 833.75,368.0 885.0,354.0 936.25,333.0 987.5,312.0 1038.75,291.0 1090.0,270.0" fill="none" stroke="#0f766e" stroke-width="4"/>
<text x="680.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 0</text>
<text x="885.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 4</text>
<text x="1090.0" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="middle" dominant-baseline="text-before-edge">Day 8</text>
<text x="835" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a65b00" text-anchor="start" dominant-baseline="text-before-edge">Scope</text>
<text x="968" y="177" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="text-before-edge">Done</text>
<rect x="64" y="476" width="1072" height="98" rx="10" fill="#eef4f8"/>
<text x="84" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">Remaining work can rise while useful work finishes. Inspect scope changes before interpreting the trend as</text>
<text x="84" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#16324f" text-anchor="start" dominant-baseline="text-before-edge">a delivery slowdown.</text>
<text x="64" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#526579" text-anchor="start" dominant-baseline="text-before-edge">Original teaching figure. Scenarios and numbers are illustrative.</text>
</svg>
